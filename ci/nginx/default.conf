upstream vdr_demo_upstream {
    # Stick by Phoenix session cookie so HTML render and LiveView WS join
    # are routed to the same backend node.
    hash $cookie__vdr_demo_key consistent;
    server app1:4000;
    server app2:4000;
    server app3:4000;
}

server {
    listen 80;
    server_name _;

    location / {
        allow all;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;

        proxy_connect_timeout 5s;

        proxy_pass http://vdr_demo_upstream;
    }
}
